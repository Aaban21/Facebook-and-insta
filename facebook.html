    <style>
        :root {
            font-family: Arial, Helvetica, sans-serif;
            color: black;

        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

        }
        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 600;

        }

        .blue {

        }

        .right {
            
            display: flex;
            align-items: center;
            justify-content: center;
            
        }

        .right form input {
            width: 35vw;
            height: 10vh;
            display: block;
            padding: 20px;
            border-radius: 20px;
            margin: 25px 10px;
            border: 1px solid rgb(201, 189, 189);
            font-size: larger;
        }

        .right form input:focus {
            border: 3px solid rgb(96, 96, 238);
        }

        .btn {
            width: 35vw;
            display: block;
            padding: 10px 10px;
            font-size: larger;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px 10px;

        }

        #login {
            background: blue;
            color: azure;
            border: none;
        }

        #create {
        display: block;
        width: 100%;
        padding: 12px;
        background-color: #ffffff;
        color: #0866ff;
        border: 1px solid #0866ff;
        border-radius: 24px;
        font-size: 15px;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        margin-bottom: 30px;
        padding: 13px;
        }

        #create:hover {
        background-color: #f0f7ff;
        }


        #forget {
            text-decoration: none;
            color: black;
            text-align: center;
            display: block;
        }

        #meta-logo {
            width: 20px;
        }

        .meta-div {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer {
      width: 100%;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-top: 1px solid #efefef;
      margin-top: 40px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      font-size: 11px;
      color: #737373;
      margin-bottom: 12px;
    }

    .footer-links a {
      color: #737373;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .footer-bottom {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 11px;
      color: #737373;
    }
    .copyright {
    max-width: 1000px;

}

      border: none;
      background: transparent;
      color: #737373;
      font-size: 11px;
      outline: none;
      cursor: pointer;
      display: flex;
    }

@media (max-width: 600px) {
