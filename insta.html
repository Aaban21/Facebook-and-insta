<head>

    <title>Document</title>

    <style>
        :root {
            font-family: Arial, Helvetica, sans-serif;
            color: black;
            background-color: white;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

        }
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 70px;
    
        }

        .left {
            
            border-right: 1px solid grey;
            
        }

        .girl {
            width: 480px;
        }

        .content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .explore {
            font-size: 4vw;
            font-weight: 600;
            margin-top: 200px;
            flex: 0 0 320px
        }

        .blue {
            color: blue;
        }

        .right {
            
            display: flex;
            align-items: center;
            justify-content: center;
            
        }

        .right form input {
            width: 35vw;
            height: 10vh;
            display: block;
            padding: 20px;
            border-radius: 20px;
            margin: 25px 10px;
            border: 1px solid rgb(201, 189, 189);
            font-size: larger;
        }

        .right form input:focus {
            border: 3px solid rgb(96, 96, 238);
        }

        .btn {
            width: 35vw;
            display: block;
            padding: 10px 10px;
            font-size: larger;
            border-radius: 30px;
            cursor: pointer;
            margin: 20px 10px;

        }

        #login {
            background: blue;
            color: azure;
            border: none;
        }

        #facebook-login {
            background: rgb(236, 236, 236);
            color: rgb(0, 0, 0);
            border: none;
        }

        #facebook-login .facebook-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            object-fit: contain;
            vertical-align: middle;
        }

        #create {
            border: 2px solid rgb(53, 53, 245);
            background: white;
            color: blue;
            margin-top: 20px;
        }

        #forget {
            text-decoration: none;
            color: black;
            text-align: center;
            display: block;
        }

        #meta-logo {
            width: 20px;
        }

        .meta-div {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer {
    position: relative;
    left: 50%;
    width: 100vw;
    margin-left: -50vw;
    background-color: white;
    color: #737373;
    font-size: 12px;
    line-height: 1.8;
    padding: 25px 20px;
    box-sizing: border-box;
}

.links {
    max-width: 1000px;
    margin: 0 auto;
    line-height: 1.8;
    overflow-wrap: break-word;
}

.links a {
    color: inherit;
    text-decoration: none;
    margin-right: 12px;
}

.footer-language {
    max-width: 1000px;
    margin: 12px auto;
}

.footer-language select {
    padding: 4px 24px 4px 8px;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    background-color: white;
    color: #737373;
    font: inherit;
    cursor: pointer;
}

.copyright {
    max-width: 1000px;
    margin: 20px auto 0;
    font-size: 11px;
}

@media (max-width: 600px) {
    .footer {
        padding: 20px 15px;
    }
}
    </style>
</head>
